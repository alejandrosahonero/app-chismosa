<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chismosa</title>
<meta name="description" content="Historias reales, contadas en anónimo. Léelas y opina en Chismosa.">
<meta property="og:title" content="Chismosa: historias anónimas">
<meta property="og:description" content="Todo el mundo tiene un chisme. Léelo entero y opina en la app.">
<meta property="og:image" content="https://chismosa-app.github.io/og.png">
<meta name="theme-color" content="#4A0000">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
  :root { --ink:#4A0000; --paper:#FFF8F0; --spice:#F4EFEA; --lav:#C9A9A0; --muted:#E0CBC6; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--ink); color:var(--paper);
         font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         display:flex; align-items:center; justify-content:center; padding:24px 16px; }
  main { max-width:420px; width:100%; }
  .mark { width:72px; height:72px; display:block; }
  .q { font: 800 96px/0.6 Georgia, serif; color:var(--spice); display:block; margin:28px 0 8px; }
  h1 { font-size:34px; line-height:1.1; margin:0 0 12px; letter-spacing:-.02em; }
  p { color:var(--muted); margin:0 0 24px; }
  .btn { display:block; text-align:center; text-decoration:none; font-weight:800;
         border-radius:16px; padding:16px; margin-bottom:12px; }
  .primary { background:var(--spice); color:var(--ink); }
  .secondary { border:2px solid #8A3A3A; color:var(--paper); }
  .code { font: 700 22px/1 ui-monospace, Consolas, monospace; letter-spacing:.12em;
          background:#6A1010; border-radius:12px; padding:14px; text-align:center;
          color:var(--lav); margin:-8px 0 24px; user-select:all; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <svg class="mark" viewBox="26 30 56 56" aria-hidden="true">
    <path fill="#F4EFEA" d="M46,32 L62,32 A18,18 0 0 1 80,50 L80,54 A18,18 0 0 1 62,72 L50,72 L35,83 L38.5,69.6 A18,18 0 0 1 28,54 L28,50 A18,18 0 0 1 46,32 Z"/>
    <path fill="none" stroke="#4A0000" stroke-width="3.6" stroke-linecap="round" d="M40.5,51.5 Q45.5,45.5 50.5,51.5"/>
    <circle cx="63" cy="49.5" r="4" fill="#4A0000"/>
    <path fill="none" stroke="#4A0000" stroke-width="3.6" stroke-linecap="round" d="M45,60 Q54,66.5 63,59.5"/>
  </svg>
  <span class="q" aria-hidden="true">“</span>
  <h1 id="title">Este chisme sigue en Chismosa</h1>
  <p id="body">Léelo entero y opina con un alias secreto. Nadie sabrá que fuiste tú.</p>
  <div class="code" id="code" hidden></div>
  <a class="btn primary" id="open" href="#">Abrir en la app</a>
  <a class="btn secondary" id="store"
     href="https://play.google.com/store/apps/details?id=com.alejandrosahonero.chismosa">Descargar en Google Play</a>
</main>
<script>
  // GitHub Pages serves this page for every path it does not have, which is
  // how /s/<id> and /g/<code> land here. Reached only when the app is not
  // installed (or App Links are not verified yet): with the app, Android opens
  // it directly and this page never loads. Anything else goes home.
  (function () {
    var PKG = 'com.alejandrosahonero.chismosa';
    var STORE = 'https://play.google.com/store/apps/details?id=' + PKG;
    var parts = location.pathname.split('/').filter(Boolean); // ['s', id] | ['g', code]
    var kind = parts[0], value = (parts[1] || '').replace(/[^A-Za-z0-9-]/g, '');
    if (!((kind === 's' || kind === 'g') && value)) { location.replace('/'); return; }
    if (kind === 'g' && value) {
      document.getElementById('title').textContent = 'Te han invitado a un grupo';
      document.getElementById('body').textContent =
        'Un mazo privado de Chismosa. Instala la app y únete con este código:';
      var code = document.getElementById('code');
      code.textContent = value;
      code.hidden = false;
    }
    // intent:// opens the app when installed, and Play when it is not.
    var target = (kind === 's' || kind === 'g') && value ? kind + '/' + value : '';
    document.getElementById('open').href =
      'intent://app/' + target + '#Intent;scheme=chismosa;package=' + PKG +
      ';S.browser_fallback_url=' + encodeURIComponent(STORE) + ';end';
    if (!/Android/i.test(navigator.userAgent)) {
      document.getElementById('open').hidden = true;
    }
  })();
</script>
</body>
</html>
