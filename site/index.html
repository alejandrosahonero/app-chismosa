<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chismosa</title>
<meta name="description" content="Historias reales, contadas en anónimo. Léelas y opina en Chismosa.">
<meta property="og:title" content="Chismosa: historias anónimas">
<meta property="og:description" content="Todo el mundo tiene un chisme. Léelo entero y opina en la app.">
<meta name="theme-color" content="#221029">
<style>
  :root { --ink:#221029; --paper:#FFF8F0; --spice:#FF4B2B; --lav:#B7A4FF; --muted:#C9B6CB; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--ink); color:var(--paper);
         font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         display:flex; align-items:center; justify-content:center; padding:24px 16px; }
  main { max-width:420px; width:100%; }
  .mark { width:72px; height:72px; display:block; }
  .q { font: 800 96px/0.6 Georgia, serif; color:var(--spice); display:block; margin:28px 0 8px; }
  h1 { font-size:34px; line-height:1.1; margin:0 0 12px; letter-spacing:-.02em; }
  p { color:var(--muted); margin:0 0 24px; }
  .btn { display:block; text-align:center; text-decoration:none; font-weight:800;
         border-radius:16px; padding:16px; margin-bottom:12px; }
  .primary { background:var(--spice); color:var(--ink); }
  .secondary { border:2px solid #4A3553; color:var(--paper); }
  .code { font: 700 22px/1 ui-monospace, Consolas, monospace; letter-spacing:.12em;
          background:#2E1B38; border-radius:12px; padding:14px; text-align:center;
          color:var(--lav); margin:-8px 0 24px; user-select:all; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <svg class="mark" viewBox="26 30 56 56" aria-hidden="true">
    <path fill="#FF4B2B" d="M46,32 L62,32 A18,18 0 0 1 80,50 L80,54 A18,18 0 0 1 62,72 L50,72 L35,83 L38.5,69.6 A18,18 0 0 1 28,54 L28,50 A18,18 0 0 1 46,32 Z"/>
    <path fill="none" stroke="#221029" stroke-width="3.6" stroke-linecap="round" d="M40.5,51.5 Q45.5,45.5 50.5,51.5"/>
    <circle cx="63" cy="49.5" r="4" fill="#221029"/>
    <path fill="none" stroke="#221029" stroke-width="3.6" stroke-linecap="round" d="M45,60 Q54,66.5 63,59.5"/>
  </svg>
  <span class="q" aria-hidden="true">“</span>
  <h1 id="title">Todo el mundo tiene un chisme.</h1>
  <p id="body">Historias reales, contadas en anónimo por gente de todo el mundo. Léelas, opina y cuenta la tuya: nadie sabrá que fuiste tú.</p>
  <div class="code" id="code" hidden></div>
    <a class="btn secondary" id="store"
     href="https://play.google.com/store/apps/details?id=com.alejandrosahonero.chismosa">Descargar en Google Play</a>
</main>
</body>
</html>
