  <script>
    // Cloudflare Turnstile, invisible mode, for the anonymous sign-up and the
    // sign-in with a recovery code (lib/services/identity/captcha). Loaded on
    // first use only. Resolves with a single-use token, or null on failure.
    window.chismosaTurnstile = function (sitekey) {
      return new Promise(function (resolve) {
        function run() {
          var box = document.createElement('div');
          box.style.cssText = 'position:fixed;left:-10000px;top:0';
          document.body.appendChild(box);
          var id;
          function done(token) {
            resolve(token || null);
            setTimeout(function () {
              try { turnstile.remove(id); } catch (e) {}
              box.remove();
            }, 0);
          }
          id = turnstile.render(box, {
            sitekey: sitekey,
            callback: done,
            'error-callback': function () { done(null); return true; },
            'expired-callback': function () { done(null); }
          });
        }
        if (window.turnstile) { run(); return; }
        var s = document.createElement('script');
        s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
        s.onload = run;
        s.onerror = function () { resolve(null); };
        document.head.appendChild(s);
      });
    };
  </script>
  <style>
    /* Brand colour behind the 2-3 MB first load instead of a white page. */
    html, body { margin: 0; height: 100%; background: #4A0000; }
  </style>
